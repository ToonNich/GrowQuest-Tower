<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
  <style>
    body {
      background: url('images/Farm_BG.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.155);
      z-index: 0;
    }
    .box {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28%; 
      height: 90px;
      background-color: #FFF2CB;
      border: 2px solid #FFBF00;
      display: flex;
      justify-content: space-between; 
      align-items: center;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      z-index: 10;
      padding: 0 10px;
      box-sizing: border-box;
    }
    #datetime-box {
      font-size: 22px;
      text-align: center;
      flex-grow: 1; 
    }
    .midnight-images {
      width: 100px;
      height: 85px;
      background: url('images/Midnight.PNG') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
    }
    .daily-check-in-button {
      width: 70px;
      height: 70px;
      background: url('images/Calendar1.PNG') no-repeat center center;
      background-size: contain;
      border: none;
      cursor: pointer;
      margin-left: 15px;
    }
    .daily-check-in-button:hover {
      background-image: url('images/Calendar2.PNG');
    }
    
    .account-button { width: 5%; height: 10%; background: url('images/Account1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 3%; right: 1.5%; z-index: 2; }
    .account-button:hover { background: url('images/Account2.PNG') no-repeat center center; background-size: cover; }
    .notification-button { width: 5%; height: 10%; background: url('images/Noti1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 17%; right: 1.5%; z-index: 2; }
    .notification-button:hover { background: url('images/Noti2.PNG') no-repeat center center; background-size: cover; }
    .notification-alert-button { width: 5%; height: 10%; background: url('images/NotiAlert1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 17%; right: 1.5%; z-index: 2; }
    .notification-alert-button:hover { background: url('images/NotiAlert2.PNG') no-repeat center center; background-size: cover; }
    .infomation-button { width: 5%; height: 10%; background: url('images/info1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 31%; right: 1.5%; z-index: 2; }
    .infomation-button:hover { background: url('images/info2.PNG') no-repeat center center; background-size: cover; }
    .light-button { width: 5%; height: 10%; background: url('images/CloseLight.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 45%; right: 1.5%; z-index: 2; transition: background-image 0.2s ease; }
    .light-button:hover:not(.on) { background: url('images/OpenLight.PNG') no-repeat center center; background-size: cover; }
    .light-button.on { background: url('images/OpenLight.PNG') no-repeat center center; background-size: cover; }
    .light-button.on:hover { background: url('images/OpenLight.PNG') no-repeat center center; background-size: cover; }
    .wateringcan-button { width: 5%; height: 10%; background: url('images/WateringCan1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 17%; left: 2%; z-index: 2; }
    .wateringcan-button:hover { background: url('images/WateringCan2.PNG') no-repeat center center; background-size: cover; }
    .watering-gif { position: absolute; top: 0; left: 0; width: 20%; pointer-events: none; display: none; z-index: 99; }
    .camera-button { width: 4.5%; height: 9.5%; background: url('images/Camera1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 30%; left: 2.25%; z-index: 2; }
    .camera-button:hover { background: url('images/Camera2.PNG') no-repeat center center; background-size: cover; }
    .checkPlant-button { width: 5%; height: 10%; background: url('images/CheckPlantBut2.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 43%; left: 2%; z-index: 2; }
    .checkPlant-button:hover { background: url('images/CheckPlantBut1.PNG') no-repeat center center; background-size: cover; }
    .achievements-button { width: 243px; height: 56px; background: url('images/Achievement1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 90%; right: 1.5%; z-index: 2; }
    .achievements-button:hover { background: url('images/Achievement2.PNG') no-repeat center center; background-size: cover; }
    .dashboard-button { width: 236px; height: 56px; background: url('images/Dashboard1.PNG') no-repeat center center; background-size: cover; border: none; cursor: pointer; position: absolute; top: 82%; right: 1.5%; z-index: 2; }
    .dashboard-button:hover { background: url('images/Dashboard2.PNG') no-repeat center center; background-size: cover; }
    .plant-image { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); width: 35%; z-index: 1; }
    .Profile-image { position: absolute; top: 2%; left: 4.5%; transform: translateX(-50%); width: 6.5%; z-index: 1; }
    #towerName { 
        position: absolute; 
        top: 2.5%; 
        left: 8%; 
        font-size: 24px; 
        color: #3a2d21;
        font-weight: bold;
        z-index: 2;
    }
    .hp-image { position: absolute; top: 8%; left: 18%; transform: translateX(-50%); width: 20%; z-index: 1; }
  </style>
</head>
<body>

  <button class="account-button" onclick="location.href='AccountPage.html'"></button>
  
  <button id="notiNormal" class="notification-button" onclick="location.href='NotificationPage.html'" style="display: none;"></button>
  <button id="notiAlert" class="notification-alert-button" onclick="location.href='NotificationPage.html'" style="display: none;"></button>
  
  <button class="infomation-button" onclick="location.href='InfomationPage.html'"></button>
  <button class="light-button" id="lightButton"></button>
  <button class="wateringcan-button"></button>
  <button class="camera-button" onclick="location.href='CameraPage.html'"></button>
  <button class="checkPlant-button" onclick="location.href='PlantAnalysis.html'"></button>
  <button class="achievements-button" onclick="location.href='AchievementsPage.html'"></button>
  <button class="dashboard-button" onclick="location.href='DashboardPage.html'"></button>
  
  <img id="wateringGif" src="images/watering.gif" class="watering-gif" />
  <img src="images/Prof.PNG" alt="Profile" class="Profile-image">
  <p id="towerName">Loading Tower...</p>
  <img src="images/HP1.PNG" alt="Hp" class="hp-image">
  <img id="character" src="images/Stage4Normal.gif" class="plant-image" />
  
  <div class="box">
    <button id="time-button" class="midnight-images"></button>
    <div id="datetime-box"></div> 
    <button class="daily-check-in-button" onclick="location.href='DailyCheckIn.html'"></button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
    // --- MODIFIED: Added setDoc and updateDoc for saving data ---
    import { getFirestore, getDocs, collection, query, where, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
                onAuthStateChanged(auth, async (user) => {
          if (user) {
            await checkNotificationStatus();
            await loadUserPlantData(user);
            // 🔧 Link raspi_01 to current user UID
            try {
              const raspiID = "raspi_01"; // Static 
              await setDoc(doc(db, "sensorLinks", raspiID), {
                uid: user.uid
              });
              console.log(`✅ Linked ${raspiID} to UID: ${user.uid}`);
            } catch (e) {
              console.error("🔥 Failed to link RasPi ID:", e);
            }
            setupPageEventListeners(user);
            } else {
                console.log("No user logged in, redirecting...");
                window.location.href = 'LoginPage.html';
            }
        });

        updateDateTimeAndButton();
        setInterval(updateDateTimeAndButton, 1000);
    });

    // ✅ Dose server now runs on the PC at :5001
    // If you open this page ON THE SAME PC, keep localhost.
    // If you open from another device, use your PC's LAN IP, e.g. "http://192.168.1.50:5001"
    const DOSE_BASE = "http://127.0.0.1:5001";

    async function triggerDose(user, durationMs = 3000) {
      try {
        const res = await fetch(`${DOSE_BASE}/dose`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // uploader/dose_server accept duration_ms; uid is optional
          body: JSON.stringify({ duration_ms: durationMs, uid: user?.uid || "" })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        console.log("✅ Dose command sent");
      } catch (err) {
        console.error("❌ Dose command failed:", err);
        alert("Could not send dose command to the PC dose server.");
      }
    }


    async function checkNotificationStatus() {
      try {
        const q = query(collection(db, "Main"), where("read", "==", false));
        const querySnapshot = await getDocs(q);
        const hasUnread = !querySnapshot.empty;

        document.getElementById("notiNormal").style.display = hasUnread ? "none" : "block";
        document.getElementById("notiAlert").style.display = hasUnread ? "block" : "none";
      } catch (error) {
        console.error("Error checking notifications:", error);
      }
    }
    
    async function loadUserPlantData(user) {
        const towerNameElement = document.getElementById("towerName");
        const characterElement = document.getElementById("character");

        const plantDocRef = doc(db, "userPlants", user.uid);
        const docSnap = await getDoc(plantDocRef);

        if (docSnap.exists()) {
            const plantData = docSnap.data();
            console.log("Loaded plant data:", plantData); 

            towerNameElement.textContent = plantData.plantName || "My Tower";
            characterElement.src = plantData.plantImage || "images/Stage4Normal.gif";
        } else {
            console.log("No plant data document found for this user.");
            towerNameElement.textContent = "Setup Your Plant!";
            characterElement.src = "images/Stage4Normal.gif"; 
        }
    }
    
    // --- MODIFIED: This function now requires the user object ---
    async function setupPageEventListeners(user) {
        const lightButton = document.getElementById("lightButton");
        let lightIsOn = localStorage.getItem("lightIsOn") === "true";
        if (lightIsOn) lightButton.classList.add("on");

        // --- MODIFIED: This event listener is now async to handle awaits ---
        lightButton.addEventListener("click", async () => {
          try {
            if (!lightIsOn) {
              const response = await fetch("http://localhost:8000/turn_on", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ colortemp: 6500, brightness: 100 }),
              });
              if (!response.ok) throw new Error("Failed to turn on light");
              lightIsOn = true;
              // --- MODIFIED: Await the new async function ---
              const achievements = await getAchievements(user);
              if (!achievements.firstLight.unlocked) {
                  achievements.firstLight.unlocked = true;
                  achievements.firstLight.unlockedAt = new Date().toISOString();
                  notifyAchievement("First Light");
                  // --- MODIFIED: Await the new async function ---
                  await saveAchievements(user, achievements);
              }
            } else {
              const response = await fetch("http://localhost:8000/turn_off", { method: "POST" });
              if (!response.ok) throw new Error("Failed to turn off light");
              lightIsOn = false;
            }
            lightButton.classList.toggle("on", lightIsOn);
            localStorage.setItem("lightIsOn", String(lightIsOn));
          } catch (err) {
            alert("Error controlling light: " + err.message);
          }
        });

        const wateringBtn = document.querySelector(".wateringcan-button");
        const wateringGif = document.getElementById("wateringGif");
        wateringBtn.addEventListener("mousedown", () => {
          wateringGif.style.display = "block";
          document.getElementById("character").src = "images/Stage4Warerting.gif";
        });
        
        document.addEventListener("mousemove", (e) => {
          if (wateringGif.style.display === 'block') {
            wateringGif.style.left = `${e.clientX}px`;
            wateringGif.style.top = `${e.clientY}px`;
          }
        });

        // --- MODIFIED: This event listener is now async to handle awaits ---
        document.getElementById("character").addEventListener("mousedown", async () => {
            document.getElementById("character").src = "images/Stage4Touch.gif";
            const achievements = await getAchievements(user);
            if (!achievements.aGentleTouch.unlocked) {
                achievements.aGentleTouch.unlocked = true;
                achievements.aGentleTouch.unlockedAt = new Date().toISOString();
                notifyAchievement("A Gentle Touch");
                await saveAchievements(user, achievements);
            }
        });

        // --- MODIFIED: This event listener is now async to handle awaits ---
        document.addEventListener("mouseup", async (e) => {
          const plantImage = document.getElementById("character");
          const plantRect = plantImage.getBoundingClientRect();

          if (wateringGif.style.display === 'block') {
            if (plantRect.width > 0 && e.clientX >= plantRect.left && e.clientX <= plantRect.right && e.clientY >= plantRect.top && e.clientY <= plantRect.bottom) {
              
              // ✅ SEND THE DOSE COMMAND TO THE PI
              await triggerDose(user);

              const achievements = await getAchievements(user);
              if (!achievements.greenThumb.unlocked) {
                  achievements.greenThumb.unlocked = true;
                  achievements.greenThumb.unlockedAt = new Date().toISOString();
                  notifyAchievement("Green Thumb");
                  await saveAchievements(user, achievements);
              }

              const today = getTodayLocalString();
              const dailyData = await getDailyCheckInData(user);
              if (!dailyData.checkIns[today]) {
                  dailyData.checkIns[today] = { taskComplete: false, rewardClaimed: false };
              }
              if (dailyData.checkIns[today].taskComplete === false) {
                  dailyData.checkIns[today].taskComplete = true;
                  await saveDailyCheckInData(user, dailyData);
                  alert("Daily Task Complete: Water the plant!");
              }
            }
          }
          
          wateringGif.style.display = 'none';
          loadUserPlantData(user);
        });
    }

    function updateDateTimeAndButton() {
      const now = new Date();
      const options = { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', options);
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById("datetime-box").textContent = `${dateStr} at ${hours}:${minutes}`;

      const hour = now.getHours();
      const button = document.getElementById("time-button");
      let imageUrl = '';
      if (hour >= 5 && hour < 8) { imageUrl = 'images/Morning.PNG'; } 
      else if (hour >= 8 && hour < 11) { imageUrl = 'images/LateMorning.PNG'; } 
      else if (hour >= 11 && hour < 15) { imageUrl = 'images/Afternoon.PNG'; } 
      else if (hour >= 15 && hour < 18) { imageUrl = 'images/Evening.PNG'; } 
      else if (hour >= 18 && hour < 21) { imageUrl = 'images/Night.PNG'; } 
      else if (hour >= 21 && hour < 24) { imageUrl = 'images/LateNight.PNG'; } 
      else { imageUrl = 'images/Midnight.PNG'; }
      button.style.backgroundImage = `url('${imageUrl}')`;
    }
    
    // --- NEW: Helper function to get the local date as a YYYY-MM-DD string ---
    function getTodayLocalString() {
        const localDate = new Date();
        const year = localDate.getFullYear();
        const month = String(localDate.getMonth() + 1).padStart(2, '0');
        const day = String(localDate.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // --- MODIFIED: Fetches achievements from Firestore ---
    async function getAchievements(user) {
        const docRef = doc(db, "userAchievements", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            return docSnap.data();
        } else {
            // Document doesn't exist, so create it for a new user
            const defaultAchievements = {
                firstLight: { unlocked: false, unlockedAt: null, name: "First Light", description: "Turn on the grow light for the first time.", icon: "images/circle-1.png" },
                greenThumb: { unlocked: false, unlockedAt: null, name: "Green Thumb", description: "Water your plant for the first time.", icon: "images/number-2.png" },
                aGentleTouch: { unlocked: false, unlockedAt: null, name: "A Gentle Touch", description: "Interact with (click on) your plant.", icon: "images/number-3.png" },
                curiousGardner: { unlocked: false, unlockedAt: null, name: "Curious Gardner", description: "Visit the 'Information' page.", icon: "images/number-4.png" },
                dailyRoutine: { unlocked: false, unlockedAt: null, name: "Daily Routine", description: "Perform all three main care actions in a single day.", icon: "images/number-5.png" }
            };
            await setDoc(docRef, defaultAchievements);
            return defaultAchievements;
        }
    }
    
    // --- MODIFIED: Saves achievements to Firestore ---
    async function saveAchievements(user, achievements) {
        const docRef = doc(db, "userAchievements", user.uid);
        // Use updateDoc to modify the existing document
        await updateDoc(docRef, achievements);
    }

    function notifyAchievement(achievementName) { 
        alert(`Achievement Unlocked: ${achievementName}!`);
    }

    // --- MODIFIED: Fetches daily data from Firestore ---
    async function getDailyCheckInData(user) {
        const docRef = doc(db, "userDailyData", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            return docSnap.data();
        } else {
            // Create a default structure for a new user
            const defaultData = { checkIns: {} };
            await setDoc(docRef, defaultData);
            return defaultData;
        }
    }

    // --- MODIFIED: Saves daily data to Firestore ---
    async function saveDailyCheckInData(user, dailyData) {
        const docRef = doc(db, "userDailyData", user.uid);
        await updateDoc(docRef, dailyData);
    }
  </script>
</body>
</html>
