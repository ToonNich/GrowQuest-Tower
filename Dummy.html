<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive SVG Example</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* Container that controls SVG size responsively */
  .svg-container {
    width: 80vw;      /* Responsive width: 80% of viewport width */
    max-width: 600px; /* Optional max width */
    margin: 20px auto;
  }

  /* Make SVG scale within container */
  .svg-container svg {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div class="svg-container">
  <!-- Inline SVG or external SVG via <img> or <object> -->
  <img src="images/AfternoonTEST.svg" alt="Afternoon Test SVG" />
</div>

</body>
</html>
