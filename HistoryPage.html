<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <style>
    body {
      font-family: 'Pixelify Sans', sans-serif;
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .back-button {
      position: absolute;
      top: 4%;
      left: 2%;
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      z-index: 3;
    }

    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }

    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }

    .head-text {
      position: absolute;
      top: 12%;
      left: 25%;
      font-size: 30px;
      z-index: 2;
    }

    .chart-container {
      position: absolute;
      top: 12%; /* ✅ reduced top gap */
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
      padding-bottom: 60px;
    }

    canvas {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 900px;
      height: 600px !important;
    }

    .pagination {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pagination button {
      padding: 10px 16px;
      font-size: 18px;
      font-family: 'Pixelify Sans', sans-serif;
      background-color: #ffd700;
      border: 4px solid #000;
      box-shadow: 4px 4px 0px #333;
      border-radius: 8px; /* ✅ softer rounded corners */
      cursor: pointer;
      color: #000;
      transition: all 0.1s;
    }

    .pagination button:hover {
      background-color: #ffa500;
      transform: translateY(2px);
      box-shadow: 2px 2px 0px #333;
    }

    .pagination button.disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <button @click="goBack" class="back-button"></button>
    <div class="chart-container">
      <canvas
        v-for="(item, index) in currentData"
        :key="index"
        :ref="'chart-' + index"
      ></canvas>

      <div class="pagination">
        <button 
          :disabled="currentPage === 1" 
          @click="changePage(currentPage - 1)">
          Previous
        </button>

        <button 
          v-for="page in visiblePages" 
          :key="page" 
          :class="{ 'disabled': currentPage === page }" 
          @click="changePage(page)">
          {{ page }}
        </button>

        <button 
          :disabled="currentPage === totalPages" 
          @click="changePage(currentPage + 1)">
          Next
        </button>
      </div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        allData: [],
        currentPage: 1,
        limit: 7,
        totalPages: 0,
        maxVisiblePages: 10,
        chartInstances: []
      },
      computed: {
        currentData() {
          const start = (this.currentPage - 1) * this.limit;
          const end = start + this.limit;
          return this.allData.slice(start, end);
        },
        visiblePages() {
          const pages = [];
          let start = Math.max(1, this.currentPage - Math.floor(this.maxVisiblePages / 2));
          let end = start + this.maxVisiblePages - 1;

          if (end > this.totalPages) {
            end = this.totalPages;
            start = Math.max(1, end - this.maxVisiblePages + 1);
          }

          for (let i = start; i <= end; i++) {
            pages.push(i);
          }

          return pages;
        }
      },
      methods: {
        goBack() {
          window.location.href = 'DashboardPage.html';
        },
        async fetchData() {
          try {
            const response = await fetch('php/get_data.php');
            const data = await response.json();

            this.allData = data.map((item, index) => ({
              label: `Record ${index + 1}`,
              data: [item.EC, item.Humidity, item.Temperature, item.Ph, item.Light]
            }));

            this.totalPages = Math.ceil(this.allData.length / this.limit);
          } catch (error) {
            console.error('Error fetching data:', error);
          }
        },
        changePage(page) {
          if (page < 1 || page > this.totalPages) return;
          this.currentPage = page;
        },
        renderCharts() {
          this.chartInstances.forEach(chart => chart.destroy());
          this.chartInstances = [];

          this.$nextTick(() => {
            this.currentData.forEach((item, index) => {
              const ctx = this.$refs['chart-' + index][0].getContext('2d');

              const chart = new Chart(ctx, {
                type: 'line',
                data: {
                  labels: ['EC', 'Humidity', 'Temperature', 'PH', 'Light'],
                  datasets: [{
                    label: item.label,
                    data: item.data,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    fill: false,
                    tension: 0.1
                  }]
                },
                options: {
                  responsive: true,
                  plugins: {
                    legend: {
                      display: true
                    }
                  },
                  scales: {
                    y: {
                      beginAtZero: true
                    }
                  }
                }
              });

              this.chartInstances.push(chart);
            });
          });
        }
      },
      watch: {
        currentPage() {
          this.renderCharts();
        }
      },
      mounted() {
        this.fetchData().then(() => {
          this.renderCharts();
        });
      }
    });
  </script>
</body>
</html>
