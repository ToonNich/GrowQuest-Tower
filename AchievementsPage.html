<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <title>Achievements</title>
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
      margin: 0;
      color: #3b2e20;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 0;
    }

    .scroll-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }

    .content-container {
        position: absolute;
        top: 9%;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 75%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #5a3d25;
    }

    .achievement-list {
      width: 90%;
      height: 80%;
      overflow-y: auto;
      padding-right: 20px;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 10px;
      background-color: rgba(139, 69, 19, 0.1);
      border: 2px solid transparent;
    }
    
    .achievement-item.unlocked {
      border: 2px solid #b18454;
      background-color: rgba(255, 242, 203, 0.3);
    }
    
    .achievement-item.locked {
      opacity: 0.6;
    }

    .achievement-icon {
      width: 64px;
      height: 64px;
      margin-right: 20px;
    }

    .achievement-details h3 {
      margin: 0 0 5px 0;
      font-size: 1.5em;
      color: #8B4513;
    }

    .achievement-details p {
      margin: 0;
      font-size: 1em;
    }

    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 4%;
      left: 2%;
      z-index: 3;
    }

    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }

  </style>
</head>
<body>

  <button class="back-button" onclick="location.href='HomePage.html'"></button>
  
  <img src="images/Scroll 3.png" alt="Achievements Background" class="scroll-image">

  <div class="content-container">
    <h1>Achievements</h1>
    <div class="achievement-list">
        <div id="ach-first-light" class="achievement-item locked">
            <img src="images/LightAchuevement.PNG" class="achievement-icon">
            <div class="achievement-details">
                <h3>First Light</h3>
                <p>Turn on the grow light for the first time.</p>
            </div>
        </div>

        <div id="ach-green-thumb" class="achievement-item locked">
            <img src="images/CanAchievement.PNG" class="achievement-icon">
            <div class="achievement-details">
                <h3>Green Thumb</h3>
                <p>Water your plant for the first time.</p>
            </div>
        </div>
        
        <div id="ach-gentle-touch" class="achievement-item locked">
            <img src="images/PlantAchievement.PNG" class="achievement-icon">
            <div class="achievement-details">
                <h3>A Gentle Touch</h3>
                <p>Interact with (click on) your plant.</p>
            </div>
        </div>

        <div id="ach-curious-gardner" class="achievement-item locked">
            <img src="images/InfoAchievement.PNG" class="achievement-icon">
            <div class="achievement-details">
                <h3>Curious Gardner</h3>
                <p>Visit the "Information" page to learn more.</p>
            </div>
        </div>

        <!-- <div id="ach-daily-routine" class="achievement-item locked">
            <img src="images/number-5.png" class="achievement-icon">
            <div class="achievement-details">
                <h3>Daily Routine</h3>
                <p>Perform all three main care actions (light, water, touch) in a single day.</p>
            </div>
        </div> -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    // This function is unchanged, it just updates the CSS classes
    function updateAchievementView(id, isUnlocked) {
        const element = document.getElementById(id);
        if (element) {
            if (isUnlocked) {
                element.classList.remove('locked');
                element.classList.add('unlocked');
            } else {
                element.classList.remove('unlocked');
                element.classList.add('locked');
            }
        }
    }

    // This is the same new function from HomePage.html
    async function getAchievements(user) {
        const docRef = doc(db, "userAchievements", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            return docSnap.data();
        } else {
            const defaultAchievements = {
                firstLight: { unlocked: false, unlockedAt: null, name: "First Light", description: "Turn on the grow light for the first time.", icon: "images/circle-1.png" },
                greenThumb: { unlocked: false, unlockedAt: null, name: "Green Thumb", description: "Water your plant for the first time.", icon: "images/number-2.png" },
                aGentleTouch: { unlocked: false, unlockedAt: null, name: "A Gentle Touch", description: "Interact with (click on) your plant.", icon: "images/number-3.png" },
                curiousGardner: { unlocked: false, unlockedAt: null, name: "Curious Gardner", description: "Visit the 'Information' page.", icon: "images/number-4.png" },
                dailyRoutine: { unlocked: false, unlockedAt: null, name: "Daily Routine", description: "Perform all three main care actions in a single day.", icon: "images/number-5.png" }
            };
            await setDoc(docRef, defaultAchievements);
            return defaultAchievements;
        }
    }

    // --- NEW: Main logic now checks for a logged-in user first ---
    document.addEventListener("DOMContentLoaded", () => {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is logged in, fetch their achievements from Firestore
                const achievements = await getAchievements(user);
                
                // Update the view based on the fetched data
                updateAchievementView('ach-first-light', achievements.firstLight.unlocked);
                updateAchievementView('ach-green-thumb', achievements.greenThumb.unlocked);
                updateAchievementView('ach-gentle-touch', achievements.aGentleTouch.unlocked);
                updateAchievementView('ach-curious-gardner', achievements.curiousGardner.unlocked);
                updateAchievementView('ach-daily-routine', achievements.dailyRoutine.unlocked);

            } else {
                // No user is signed in. Redirect to login page.
                console.log("No user is logged in. Redirecting...");
                window.location.href = 'LoginPage.html';
            }
        });
    });
  </script>
</body>
</html>
