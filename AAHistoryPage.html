<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
      margin: 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 0;
    }

    .button-container {
      position: relative;
      height: 100vh;
      z-index: 2;
    }

    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 4%;
      left: 2%;
      z-index: 3;
    }

    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }

    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }

    .head-text {
      position: absolute;
      font-size: 30px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      z-index: 2;
    }

    .chart-container {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
      padding-bottom: 50px;
    }

    canvas {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 900px;  /* เพิ่มความกว้างจาก 600px เป็น 900px */
      height: 400px !important; /* ความสูงที่เพิ่มไว้ */
    }
  </style>
</head>
<body>
  <div class="button-container">
    <button class="back-button" onclick="location.href='HomePage.html'"></button>
  </div>

  <img src="images/Scroll Long.PNG" alt="Middle Layer" class="middle-image">
  <p class="head-text" style="top: 15%; left: 25%;">Information</p>

  <div class="chart-container" id="chartContainer">
    <!-- กราฟจะถูกสร้างแบบไดนามิก -->
  </div>

  <script>
    fetch('php/get_data.php')
      .then(response => response.json())
      .then(data => {
        const labels = data.map((_, index) => `Record ${data.length - index}`);

        data.forEach((item, index) => {
          const canvas = document.createElement('canvas');
          canvas.id = `chart-${index}`;
          canvas.width = 900;  // เพิ่มความกว้างผ่าน JavaScript
          canvas.height = 400; // เพิ่มความสูงผ่าน JavaScript
          document.getElementById('chartContainer').appendChild(canvas);

          const chartData = {
            labels: ['EC', 'Humidity', 'Temperature', 'pH'],
            datasets: [{
              label: `Record ${data.length - index}`,
              data: [
                parseFloat(item.EC),
                parseFloat(item.Humidity),
                parseFloat(item.Temperature),
                parseFloat(item.Ph)
              ],
              backgroundColor: 'rgba(75, 192, 192, 0.2)',
              borderColor: 'rgba(75, 192, 192, 1)',
              borderWidth: 2,
              fill: false,
              tension: 0.1
            }]
          };

          new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: chartData,
            options: {
              responsive: false, // ต้องปิด responsive เพื่อให้ขนาด width/height มีผลจาก JavaScript
              plugins: {
                legend: {
                  display: true
                }
              },
              scales: {
                y: {
                  beginAtZero: false
                }
              }
            }
          });
        });
      })
      .catch(error => console.error('Error fetching data:', error));
  </script>
</body>
</html>
