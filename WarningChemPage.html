<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning Chemical</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }
    .head-text {
      position: absolute;
      font-size: 30px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      z-index: 2;
    }
    .icon-chemical {
      background: url('images/Chemical.PNG') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      width: 180px;
      height: auto;
      top: 13.5%;
      left: 25%;
      z-index: 2;
    }
    .icon-label {
      position: absolute;
      width: 70px;
      height: auto;
      z-index: 4;
    }
    .SwitchAutoManual {
      position: absolute;
      top: 75%;
      left: 29%;
      width: 40px;
      height: auto;
      z-index: 2;
      transform: rotate(90deg);
    }
    .auto-button {
      position: absolute;
      top: 80.5%;
      left: 31.5%;
      width: 35px;
      height: 65px;
      z-index: 5;
      background: transparent;
      border: none;
      transform: rotate(90deg);
    }
    .manual-button {
      position: absolute;
      top: 80.2%;
      left: 27%;
      width: 35px;
      height: 70px;
      z-index: 5;
      background: transparent;
      border: none;
      transform: rotate(90deg);
    }
    .board-images {
      position: absolute;
      top: 12%;
      right: 22%;
      width: 600px;
      height: auto;
      z-index: 4;
    }
    .tube-outer {
      width: 45px;
      height: 315px;
      border: 6px solid white;
      background-color: transparent;
      overflow: hidden;
      position: absolute; /* ต้องมี */
    }

    .tube-inner {
      width: 100%;
      background-color: #00ffff;
      position: absolute;
      bottom: 0;
      transition: height 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='DashboardPage.html'"></button>
  <div>
    <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
    <div>
        <img src="images/Chemical.PNG" class="icon-chemical" alt="Chemical" />
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 27%; left: 28%;" />
        <!-- ✅ หลอดสาร -->
        <div class="tube-outer" style="top: 27.5%; left: 28.5%; position: absolute; z-index: 3;">
          <div class="tube-inner" id="chemicalBar"></div>
        </div>

        <div id="chemicalValue" style="position: absolute;top: 65%;left: 28.5%;font-size: 20px;font-weight: bold;font-family: 'Pixelify Sans', sans-serif;color: #003366;z-index: 4;">--</div>

        <div class="switch-mode-container">
          <img id="switchImageChem" src="images/SwitchAutoManual.PNG" alt="button-switch" class="SwitchAutoManual" />
          <button class="auto-button"
            onmouseover="changeImage('switchImageChem', 'images/AutoButton.PNG')"
            onmouseout="resetImage('switchImageChem')"
            onclick="changeImage('switchImageChem', 'images/AutoButton.PNG', 'auto')"
          ></button>
          <button class="manual-button"
            onmouseover="changeImage('switchImageChem', 'images/MaunualButton.PNG')"
            onmouseout="resetImage('switchImageChem')"
            onclick="changeImage('switchImageChem', 'images/MaunualButton.PNG', 'manual')"
          ></button>
        </div>
    </div>
    <div>
      <img src="images/Blackboard.PNG" class="board-images" alt="board" />
    </div>
  </div>
</body>

<script>
  function changeImage(id, src, mode = "") {
    const img = document.getElementById(id);
    if (!img) return;
    if (mode) {
      localStorage.setItem(id + "_mode", mode); // 🔁 Save
    }
    img.src = src;
  }

  function resetImage(id) {
    const img = document.getElementById(id);
    const mode = localStorage.getItem(id + "_mode");
    if (!mode) {
      img.src = "images/SwitchAutoManual.PNG";
    } else if (mode === "auto") {
      img.src = "images/AutoButton.PNG";
    } else if (mode === "manual") {
      img.src = "images/MaunualButton.PNG";
    }
  }

</script>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import {
    getFirestore,
    collection,
    query,
    orderBy,
    limit,
    onSnapshot
  } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
    authDomain: "seniorproject-684c1.firebaseapp.com",
    projectId: "seniorproject-684c1",
    storageBucket: "seniorproject-684c1.appspot.com",
    messagingSenderId: "847138584376",
    appId: "1:847138584376:web:eface0926c96092daef3cd",
    measurementId: "G-N0CM5TQBM8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const chemicalQuery = query(collection(db, "tube"), orderBy("timestamp", "desc"), limit(1));

  onSnapshot(chemicalQuery, (snapshot) => {
    if (snapshot.empty) return;

    const data = snapshot.docs[0].data();
    const chemical = data.chemical !== undefined ? data.chemical : 50;

    updateTube('chemicalBar', chemical, 100);
    updateText('chemicalValue', chemical.toFixed(1) + " ppm");
    console.log("🧪 Chemical Level:", chemical);
  });

  function updateTube(id, value, max) {
    const percent = Math.min(100, (value / max) * 100);
    const el = document.getElementById(id);
    if (el) el.style.height = `${percent}%`;
  }

  function updateText(id, text) {
    const el = document.getElementById(id);
    if (el) el.innerText = text;
  }

  const defaultImages = {
    switchImageChem: "images/SwitchAutoManual.PNG"
  };

  const clickedStates = {
    switchImageChem: false
  };

  const currentModes = {
    switchImageChem: ""
  };

  window.changeImage = function (id, src, mode = "") {
    const img = document.getElementById(id);
    if (!img) return;
    if (mode) {
      localStorage.setItem(id + "_mode", mode);
    }
    img.src = src;
  };

  window.resetImage = function (id) {
    const img = document.getElementById(id);
    const mode = localStorage.getItem(id + "_mode");
    if (!mode) {
      img.src = "images/SwitchAutoManual.PNG";
    } else if (mode === "auto") {
      img.src = "images/AutoButton.PNG";
    } else if (mode === "manual") {
      img.src = "images/MaunualButton.PNG";
    }
  };

  window.onload = () => {
    resetImage("switchImageChem");
  };
</script>

</html>
