<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
     .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }
    .head-text {
      position: absolute;
      font-size: 30px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      z-index: 2;
    }
    .input-box {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 45%;
    padding: 8px;
    font-size: 18px;
    border: 0.5px solid #2F6A31;
    border-radius: 10px;
    background-color: #D9FFDA;
    z-index: 2; 
  }
    .register-button {
      width: 196px;
      height: 54px;
      background: url('images/regisButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .register-button:hover {
      background: url('images/regisButton2.png') no-repeat center center;
      background-size: cover;
    }
    .login-button {
      position: absolute; top: 85%; left: 70%; 
      font-size: 28px;
      text-decoration: underline; 
      background: none; border: none; 
      color: #000; font-family: 'Pixelify Sans', sans-serif;
      z-index: 2;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='LoginPage.html'"></button>
  <div>
    <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
      <form id="registerForm">
      <p class="head-text" style="top: 6%; left: 23%;">Username:</p>
      <input type="text" id="username" name="Username" class="input-box" style="top: 20%; left: 49%;" required>
      <p class="head-text" style="top: 22%; left: 23%;">Email:</p>
      <input type="email" name="Email" id="registerEmail" class="input-box" style="top: 36%; left: 49%;" required> 
      <p class="head-text" style="top: 38%; left: 23%;">Password:</p>
      <input type="password" name="Password" id="registerPassword" class="input-box" style="top: 52%; left: 49%;" required>   
      <p class="head-text" style="top: 54%; left: 23%;">Confirm Password:</p>
      <input type="password" name="ConfirmPassword" id="confirmPassword" class="input-box" style="top: 68%; left: 49%;" required>
      <p id="error-msg" style="color: red; font-size: 16px; position:absolute; top: 72%; left: 50%; transform: translateX(-50%); z-index: 3; text-align: center;"></p>
      <div>
        <p class="head-text" style="top: 80%; left: 70%;text-decoration: underline;" onclick="location.href='LoginPage.html'">Login</p>
      </div>
      <button type="submit" class="register-button"></button>
    </form>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
    authDomain: "seniorproject-684c1.firebaseapp.com",
    projectId: "seniorproject-684c1",
    storageBucket: "seniorproject-684c1.appspot.com",
    messagingSenderId: "847138584376",
    appId: "1:847138584376:web:eface0926c96092daef3cd",
    measurementId: "G-N0CM5TQBM8"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  const errorMsgElement = document.getElementById("error-msg");

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      errorMsgElement.innerText = "❌ Passwords do not match!";
      return;
    }
    if (password.length < 6) {
      errorMsgElement.innerText = "❌ Password must be at least 6 characters long.";
      return;
    }

    errorMsgElement.innerText = "";

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // After creating the user, update their profile with the display name
        return updateProfile(userCredential.user, {
            displayName: username
        });
      })
      .then(() => {
        alert("Registration successful! You can now log in.");
        window.location.href = "LoginPage.html";
      })
      .catch((error) => {
        if (error.code === 'auth/email-already-in-use') {
          errorMsgElement.innerText = "❌ This email is already registered.";
        } else {
          errorMsgElement.innerText = "Error: " + error.message;
        }
      });
  });
</script>
</body>
</html>
