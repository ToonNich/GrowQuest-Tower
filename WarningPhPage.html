<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning pH</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }
    .head-text {
      position: absolute;
      font-size: 30px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      z-index: 2;
    }
    .icon-ph {
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      width: 180px;
      height: auto;
      top: 12.5%; 
      left: 25%; 
      z-index: 2;
    }
    .icon-label {
      position: absolute;
      width: 70px;
      height: auto;
      z-index: 2;
    }
    .board-images {
      position: absolute;
      top: 12%;
      right: 22%;
      width: 600px;
      height: auto;
      z-index: 4;
    }
    .tube-outer {
      width: 45px;
      height: 315px;
      border: 6px solid white;
      background-color: transparent;
      overflow: hidden;
      position: absolute;
    }
    .tube-inner {
      width: 100%;
      background-color: #00ffff;
      position: absolute;
      bottom: 0;
      transition: height 0.5s ease-in-out;
    }
    .blackboard-tip {
      position: absolute;
      top: 170px;
      right: 27.5%;
      width: 400px;
      min-height: 100px;
      color: #fffbe0;
      font-family: 'Pixelify Sans', monospace;
      font-size: 19px;
      text-shadow: 1px 2px 2px #222, 0 0 10px #0a2e12;
      padding: 24px 18px 10px 18px;
      background: rgba(0,0,0,0.06);
      border-radius: 10px;
      box-sizing: border-box;
      z-index: 6;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='DashboardPage.html'"></button>
  <div>
    <!-- 🔽 รูปกลางที่อยู่ระหว่าง bg และ sprite -->
    <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
    <div>
      <img src="images/ph.PNG" class="icon-ph" alt="ph" />
      <img src="images/label.PNG" class="icon-label" alt="label" style="top: 27%; left: 28%;" />
      <!-- ✅ หลอดสาร -->
      <div class="tube-outer" style="top: 27.5%; left: 28.5%; position: absolute; z-index: 3;">
        <div class="tube-inner" id="phBar"></div>
      </div>
      <div id="phValue" style="position: absolute;top: 65%;left: 28.8%;font-size: 20px;font-weight: bold;font-family: 'Pixelify Sans', sans-serif;color: #003366;z-index: 4;">--</div>
    </div>
    <div>
      <img src="images/Blackboard.PNG" class="board-images" alt="board" />
      <div class="blackboard-tip"></div>
    </div>
  </div>

  <script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
    authDomain: "seniorproject-684c1.firebaseapp.com",
    projectId: "seniorproject-684c1",
    storageBucket: "seniorproject-684c1.appspot.com",
    messagingSenderId: "847138584376",
    appId: "1:847138584376:web:eface0926c96092daef3cd",
    measurementId: "G-N0CM5TQBM8"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  // ---------- PH TIPS (kept from your page) ----------
  const tipsHigh = [
    "pH climbing! Your tower’s roots can’t absorb all nutrients if the water is too alkaline. Add pH down a few drops at a time and test as you go.",
    "High pH can cause nutrient lockout. Use only hydroponic-safe pH adjusters, and avoid tap water with high minerals.",
    "Remember: in hydroponics, pH swings can happen fast. Test your solution daily, and adjust gently to stay in the sweet spot."
  ];
  const tipsLow = [
    "Acidic waters ahead! pH down low can harm root tips. Add pH up slowly, and change out your solution if pH stays stubborn.",
    "Low pH might mean too much organic matter or old solution. Refresh your water and re-check all settings.",
    "Always add pH adjusters a bit at a time, stirring well. Hydroponic roots like a stable, gentle environment!"
  ];
  function pickTip(ph) {
    if (ph >= 8.0) return tipsHigh[Math.floor(Math.random() * tipsHigh.length)];
    if (ph <= 5.5) return tipsLow[Math.floor(Math.random() * tipsLow.length)];
    return "pH is perfect! Your hydroponic roots are in the nutrient sweet spot.";
  }

  // ---------- small helpers ----------
  function updateTube(id, value, max) {
    const el = document.getElementById(id);
    if (!el) return;
    const percent = Math.min(100, Math.max(0, (Number(value) || 0) / max * 100));
    el.style.height = `${percent}%`;
  }
  function updateText(id, text) {
    const el = document.getElementById(id);
    if (el) el.innerText = text;
  }

  // 🔑 Use the signed-in user's UID like Dashboard; fallback to 'tube' if nobody is logged in.
  onAuthStateChanged(auth, (user) => {
    const phQuery = user
      ? query(collection(db, "tubeData", user.uid, "readings"), orderBy("timestamp","desc"), limit(1))
      : query(collection(db, "tube"), orderBy("timestamp","desc"), limit(1));

    onSnapshot(phQuery, (snapshot) => {
      if (snapshot.empty) return;

      const data = snapshot.docs[0].data();
      const ph = (typeof data.ph === 'number') ? data.ph : 7;

      updateTube('phBar', ph, 14);           // pH scale 0..14
      const phEl = document.getElementById('phValue');
      if (phEl) phEl.innerText = ph.toFixed(2);

      const tipDiv = document.querySelector('.blackboard-tip');
      if (tipDiv) tipDiv.textContent = pickTip(ph);
    });
  });
  </script>

</body>
</html>
