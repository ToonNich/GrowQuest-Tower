<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('images/Wooden Stage.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Pixelify Sans', sans-serif;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.322);
            z-index: 0;
        }
        .back-button {
            width: 60px;
            height: 44px;
            background: url('images/backButton1.png') no-repeat center center;
            background-size: cover;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 6%;
            left: 4%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .back-button:hover {
            background: url('images/backButton2.png') no-repeat center center;
            background-size: cover;
        }
        .light-image {
            position: absolute;
            top: -38%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            z-index: 1;
        }
        .head-text {
            position: absolute;
            font-size: 30px;
            padding: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            z-index: 2;
            }
        .input-box {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 25%;
            padding: 8px;
            font-size: 18px;
            border: 0.5px solid #2F6A31;
            border-radius: 10px;
            background-color: #D9FFDA;
            z-index: 2; 
        }
        .plant-image {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            z-index: 1;
        }
        .Profile-image {
            position: absolute;
            top: 2%;
            left: 4.5%;
            transform: translateX(-50%);
            width: 6.5%;
            z-index: 1;
        }
        .save-button {
        width: 156px;
        height: 56px;
        background: url('images/Save1.PNG') no-repeat center center;
        background-size: cover;
        border: none;
        cursor: pointer;
        position: absolute;
        top: 90%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        }
        .save-button:hover {
        background: url('images/Save2.PNG') no-repeat center center;
        background-size: cover;
        }
        .preSlide-button {
        width: 26px;
        height: 41px;
        background: url('images/PreSlide1.PNG') no-repeat center center;
        background-size: cover;
        border: none;
        cursor: pointer;
        position: absolute;
        top: 50%;
        left: 3%;
        transform: translate(-50%, -50%);
        z-index: 2;
        }
        .preSlide-button:hover {
        background: url('images/PreSlideTwo.PNG') no-repeat center center;
        background-size: cover;
        }
        .nextSlide-button {
        width: 26px;
        height: 41px;
        background: url('images/NextSlide1.PNG') no-repeat center center;
        background-size: cover;
        border: none;
        cursor: pointer;
        position: absolute;
        top: 50%;
        right: 3%;
        transform: translate(-50%, -50%);
        z-index: 2;
        }
        .nextSlide-button:hover {
        background: url('images/NextSlideTwo.PNG') no-repeat center center;
        background-size: cover;
        }
    </style>
</head>
<body>
    <img src="images/light.png" class="light-image">
    <button class="back-button" onclick="location.href='LoginPage.html'"></button>

    <div> 
        <p class="head-text" style="top: 6%; left: 6%;">Tower Name:</p>
        <input type="text" id="towerNameInput" class="input-box" style="top: 12%; left: 25%;" required>
    </div>   
    <div>
        <button class="preSlide-button"></button>
        <button class="nextSlide-button"></button>
    </div>
    
    <img id="character" src="images/NormalPlant.gif" class="plant-image">
    <button type="button" class="save-button"></button>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const characters = [ "images/NormalPlant.gif", "images/RaPlant.gif", "images/InsectBite.gif" ];
    let currentIndex = 0;
  
    const characterImage = document.getElementById("character");
    const towerNameInput = document.getElementById("towerNameInput");

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const plantDocRef = doc(db, "userPlants", user.uid);
            const docSnap = await getDoc(plantDocRef);

            if (docSnap.exists()) {
                const plantData = docSnap.data();
                towerNameInput.value = plantData.plantName || '';
                const savedImageIndex = characters.indexOf(plantData.plantImage);
                if (savedImageIndex !== -1) {
                    currentIndex = savedImageIndex;
                    characterImage.src = characters[currentIndex];
                }
            }

            document.querySelector(".preSlide-button").addEventListener("click", () => {
                currentIndex = (currentIndex - 1 + characters.length) % characters.length;
                characterImage.src = characters[currentIndex];
            });
        
            document.querySelector(".nextSlide-button").addEventListener("click", () => {
                currentIndex = (currentIndex + 1) % characters.length;
                characterImage.src = characters[currentIndex];
            });

            document.querySelector(".save-button").addEventListener("click", async () => {
                const towerName = towerNameInput.value;
                if (!towerName) {
                    alert("Please enter a name for your tower!");
                    return;
                }
                
                const plantDataToSave = {
                    plantName: towerName,
                    plantImage: characters[currentIndex]
                };

                // --- NEW: Log the UID being used to save ---
                console.log("Saving data for user ID:", user.uid);

                try {
                    await setDoc(doc(db, "userPlants", user.uid), plantDataToSave);
                    alert("Plant data saved successfully!");
                    window.location.href = "HomePage.html";
                } catch (error) {
                    console.error("Error saving plant data: ", error);
                    alert("Failed to save plant data. Please try again.");
                }
            });

        } else {
            alert("You must be logged in to set up your plant.");
            window.location.href = 'LoginPage.html';
        }
    });
</script>
</body>
</html>
