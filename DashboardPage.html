  <script>
  function changeImage(id, src, mode = "") {
    const img = document.getElementById(id);
    if (!img) return;
    if (mode) {
      localStorage.setItem(id + "_mode", mode); // 🔁 Save
    }
    img.src = src;
  }

  function resetImage(id) {
    const img = document.getElementById(id);
    const mode = localStorage.getItem(id + "_mode");
    if (!mode) {
      img.src = "images/SwitchAutoManual.PNG";
    } else if (mode === "auto") {
      img.src = "images/AutoButton.PNG";
    } else if (mode === "manual") {
      img.src = "images/MaunualButton.PNG";
    }
  }

</script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getFirestore, collection, query, orderBy, limit, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
    import {getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const latestQuery = query(collection(db, "alerts"), orderBy("timestamp", "desc"), limit(1));
    let latestDocRef = null; // 🔁 เก็บ docRef ล่าสุด

    onSnapshot(latestQuery, (snapshot) => {
      if (snapshot.empty) return;

      const docSnap = snapshot.docs[0];
      latestDocRef = docSnap.ref; // ✅ เก็บไว้ใช้อัปเดต

      const latest = snapshot.docs[0].data();
      const values = latest.values;

      updateTube('humidityBar', values.humidity, 100);
      updateTube('temperatureBar', values.temp, 50);
      updateTube('chemicalBar', parseFloat(values.chemical), 100);
      updateTube('ecBar', values.ec, 5);
      updateTube('phBar', values.ph, 14);
      updateTube('lightBar', values.light, 100);

      const dismissed = latest.dismissed || {};
      showWarningIcon('warningHumidity', !dismissed.humidity && (values.humidity > 90 || values.humidity < 20));
      showWarningIcon('warningTemp', !dismissed.temp && (values.temp > 40 || values.temp < 10));
      showWarningIcon('warningPH', !dismissed.ph && (values.ph > 8 || values.ph < 5.5));
      showWarningIcon('warningEC', !dismissed.ec && (values.ec > 3 || values.ec < 0.2));
      showWarningIcon('warningChemical', !dismissed.chemical && (values.chemical > 50 || values.chemical < 5));

      console.log("📡 Real-time update:", values);
    });


    function updateTube(id, value, max) {
      const percent = Math.min(100, (value / max) * 100);
      const el = document.getElementById(id);
      if (el) el.style.height = `${percent}%`;
    }

    const defaultImages = {
      switchImageChem: "images/SwitchAutoManual.PNG",
      switchImageLight: "images/SwitchAutoManual.PNG"
    };

    const clickedStates = {
      switchImageChem: false,
      switchImageLight: false
    };

    const currentModes = {
      switchImageChem: "",
      switchImageLight: ""
    };

    function changeImage(id, src, mode = "") {
  const img = document.getElementById(id);
  if (!img) return;

  if (mode) {
    clickedStates[id] = true;
    currentModes[id] = mode;
    localStorage.setItem(id + "_mode", mode);
  }
  img.src = src;
}

function resetImage(id) {
  const img = document.getElementById(id);
  if (!img) return;

  const savedMode = localStorage.getItem(id + "_mode");
  if (!clickedStates[id] && !savedMode) {
    img.src = defaultImages[id];
  } else {
    const mode = currentModes[id] || savedMode;
    img.src = mode === "auto" ? "images/AutoButton.PNG" :
              mode === "manual" ? "images/MaunualButton.PNG" :
              defaultImages[id];
  }
}

      // ✅ ทำให้เรียกใช้ได้จาก HTML
      window.changeImage = changeImage;
      window.resetImage = resetImage;

    function showWarningIcon(id, condition) {
      const el = document.getElementById(id);
      if (el) el.style.display = condition ? 'block' : 'none';
    }

    const labelToWarningMap = {
      labelHumidity: "warningHumidity",
      labelTemp: "warningTemp",
      labelChemical: "warningChemical",
      labelEC: "warningEC",
      labelPH: "warningPH",
      labelLight: "warningLight"
    };

    Object.keys(labelToWarningMap).forEach(labelId => {
      const label = document.getElementById(labelId);
      if (label) {
        label.addEventListener("click", () => {
          const warningId = labelToWarningMap[labelId];
          const warningEl = document.getElementById(warningId);
          if (warningEl) warningEl.style.display = "none";
        });
      }
    });

    function dismissAndRedirect(key, url) {
      if (!latestDocRef) return;

      updateDoc(latestDocRef, {
        [`dismissed.${key}`]: true
      }).then(() => {
        console.log(`✅ Dismissed "${key}" updated`);
        location.href = url;
      }).catch(err => {
        console.error("❌ Update failed:", err);
      });
    }
    window.dismissAndRedirect = dismissAndRedirect;
    window.onload = () => {
      ["switchImageLight", "switchImageChem"].forEach(resetImage);
    };
  </script>
