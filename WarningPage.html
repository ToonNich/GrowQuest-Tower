<!DOCTYPE html>

  <title>Information</title>
  <style>
    body {

      background-size: cover;
      margin: 0;
      font-family: 'Pixelify Sans', sans-serif;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;

      width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.4);
      z-index: 0;
    }

    .middle-container {

    .middle-image {

        z-index: 2;
    }
    .icon-humidity {
      background: url('images/Huminity.PNG') no-repeat center center;

      border: none;
      cursor: pointer;
      position: absolute;
      top: 15%; 
      left: 15%;
      z-index: 2;
    } 
    .icon-humidity:hover {
      background: url('images/Huminity.PNG') no-repeat center center;
      background-size: cover;
    }
    .icon-temperature {
      background: url('images/Temperature.PNG') no-repeat center center;

    }

    }
    .icon-chemical {
      background: url('images/Chemical.PNG') no-repeat center center;

    }

    }
    .icon-ec{
        top: 50%; 
        left: 30%;

        z-index: 2; 
    }
    .icon-ec {
      background: url('images/ec.PNG') no-repeat center center;
      background-size: cover;

      cursor: pointer;
      position: absolute;
      width: 135px; /* ปรับขนาดไอคอน */
      height: auto;
      top: 50%; 
      left: 30%;  
      z-index: 2;
    } 
    .icon-ec:hover {
      background: url('images/ec.PNG') no-repeat center center;
      background-size: cover;
    }
    .icon-ph { 
        top: 49%; 
        right: 30.5%; 
        position: absolute;
        width: 135px; /* ปรับขนาดไอคอน */
        height: auto;
        z-index: 2; 
    }
    .icon-ph {
      background: url('images/ph.PNG') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      width: 135px; /* ปรับขนาดไอคอน */
      height: auto;
      top: 49.5%; 
      right: 30.5%; 
      z-index: 2;
    } 
    .icon-ph:hover {
      background: url('images/ph.PNG') no-repeat center center;
      background-size: cover;
    }

    .icon-label {
        position: absolute;
        width: 70px; /* ปรับขนาดไอคอน */
        height: auto;
        z-index: 2; 
    }

    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 1%;
      left: 2%;
      z-index: 3;
    }

    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
    .warning-button {
        width: 60px; /* กำหนดขนาดของปุ่ม */
        height: 40px; /* กำหนดความสูงของปุ่ม */
        background: url('images/warning1.PNG') no-repeat center center;
        background-size: cover; /* ให้รูปภาพปรับขนาดตามพื้นที่ของปุ่ม */
        border: none;
        cursor: pointer; /* เปลี่ยน cursor เป็นมือเมื่อ hover บนปุ่ม */
        position: absolute;
        top: 87%; /* อยู่กลางหน้าจอในแนวตั้ง */
        left: 14%;
        transform: translate(-50%, -50%); /* จัดตำแหน่งให้ตรงกลาง */
        z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    /* เปลี่ยนแปลงเมื่อ hover ที่ปุ่ม */
    .warning-button:hover {
        background: url('images/warning2.PNG') no-repeat center center; /* เปลี่ยนเป็นรูปที่เตรียมไว้ */
        background-size: cover; /* ให้รูปภาพที่ใหม่ปรับขนาด */
    }
    .history-button {
        width: 65px; /* กำหนดขนาดของปุ่ม */
        height: 65px; /* กำหนดความสูงของปุ่ม */
        background: url('images/history1.PNG') no-repeat center center;
        background-size: cover; /* ให้รูปภาพปรับขนาดตามพื้นที่ของปุ่ม */
        border: none;
        cursor: pointer; /* เปลี่ยน cursor เป็นมือเมื่อ hover บนปุ่ม */
        position: absolute;
        top: 86.5%; /* อยู่กลางหน้าจอในแนวตั้ง */
        right: 14%;
        transform: translate(-50%, -50%); /* จัดตำแหน่งให้ตรงกลาง */
        z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    /* เปลี่ยนแปลงเมื่อ hover ที่ปุ่ม */
    .history-button:hover {
        background: url('images/history2.PNG') no-repeat center center; /* เปลี่ยนเป็นรูปที่เตรียมไว้ */
        background-size: cover; /* ให้รูปภาพที่ใหม่ปรับขนาด */
    } 

    .infomation-label-button {
        width: 65px; /* กำหนดขนาดของปุ่ม */
        height: 65px; /* กำหนดความสูงของปุ่ม */

        background-size: cover; /* ให้รูปภาพปรับขนาดตามพื้นที่ของปุ่ม */
        border: none;
        cursor: pointer; /* เปลี่ยน cursor เป็นมือเมื่อ hover บนปุ่ม */

        right: 8%;
        transform: translate(-50%, -50%); /* จัดตำแหน่งให้ตรงกลาง */
        z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    /* เปลี่ยนแปลงเมื่อ hover ที่ปุ่ม */
    .infomation-label-button:hover {
        background: url('images/Info2.PNG') no-repeat center center; /* เปลี่ยนเป็นรูปที่เตรียมไว้ */
        background-size: cover; /* ให้รูปภาพที่ใหม่ปรับขนาด */
    } 
    .SwitchAutoManual { 
    position: absolute;
    top: 37.5%;
    right: 15%;
    width: 40px;
    height: auto;
    z-index: 1;
    } 

  .auto-button {
    position: absolute;
    top: 38%;
    right: 15.2%;
    width: 35px;
    height: 65px;
    z-index: 4;
    background: transparent;
    border: none;
    }

  .manual-button {
    position: absolute;
    top: 44%;
    right: 15.2%;
    width: 35px;
    height: 70px;
    z-index: 4;
    background: transparent;
    border: none;
   }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='DashboardPage.html'"></button>

  <div class="middle-container">
    <img src="images/Scroll Long.PNG" alt="Middle Layer" class="middle-image" />

    <!-- รูปซ้อน -->
    <div>
        <!-- <img src="images/Huminity.PNG" class="icon-humidity" alt="Humidity" /> -->
        <button class="icon-humidity"style="width: 160px; height: 90px;" onclick="location.href='WarningHumiPage.html'"></button>
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 23%; left: 18.5%;"/>
    </div>
    <div>
        <!-- <img src="images/Temperature.PNG" class="icon-temperature" alt="Temperature" /> -->
        <button class="icon-temperature" style="width: 180px; height: 110px;" onclick="location.href='WarningTempPage.html'"></button>
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 23%; left: 47%;"/>
    </div>
    <div>
      <button class="icon-chemical" style="width: 180px; height: 90px;" onclick="location.href='WarningChemPage.html'"></button>
      <img src="images/label.PNG" class="icon-label" alt="label" style="top: 23%; right: 19.5%;" />

      <div class="switch-mode-container">
        <img id="switchImage" src="images/SwitchAutoManual.PNG" alt="button-switch" class="SwitchAutoManual" />

        <button class="auto-button"
          onmouseover="changeImage('images/AutoButton.PNG')"
          onmouseout="resetImage()"
          onclick="changeImage('images/AutoButton.PNG', 'auto')"
        ></button>

        <button class="manual-button"
          onmouseover="changeImage('images/MaunualButton.PNG')"
          onmouseout="resetImage()"
          onclick="changeImage('images/MaunualButton.PNG', 'manual')"
        ></button>

      </div>
    </div>
    <div>
        <!-- <img src="images/ec.PNG" class="icon-ec" alt="EC" /> -->
        <button class="icon-ec" style="width: 135px; height: 70px;" onclick="location.href='WarningEcPage.html'"></button>
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 57%; left: 32.5%;"/>
    </div>
    <div>
        <!-- <img src="images/ph.PNG" class="icon-ph" alt="pH" /> -->
        <button class="icon-ph" style="width: 130px; height: 70px;" onclick="location.href='WarningPhPage.html'"></button>
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 57%; right: 33.5%;" />
    </div>

    <button class="history-button" onclick="location.href='HistoryPage.html'"></button>
    <button class="infomation-label-button" onclick="location.href='InfomationLabelPage.html'"></button>
  </div>
</body>
<script>
  const defaultImage = "images/SwitchAutoManual.PNG";
  let isClicked = false;
  let currentMode = ""; // "auto" or "manual"

  function changeImage(src, mode = "") {
    if (mode) {
      isClicked = true;
      currentMode = mode;
    }
    document.getElementById("switchImage").src = src;
  }

  function resetImage() {
    if (!isClicked) {
      document.getElementById("switchImage").src = defaultImage;
    } else {
      // กำหนดให้แสดงรูปตามโหมดล่าสุดที่คลิก
      if (currentMode === "auto") {
        document.getElementById("switchImage").src = "images/AutoButton.PNG";
      } else if (currentMode === "manual") {
        document.getElementById("switchImage").src = "images/MaunualButton.PNG";
      }
    }
  }
</script>
</html>
