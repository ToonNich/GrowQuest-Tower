<script>

  const defaultImages = {
  switchImageChem: "images/SwitchAutoManual.PNG",
  switchImageLight: "images/SwitchAutoManual.PNG"
};

const clickedStates = {
  switchImageChem: false,
  switchImageLight: false
};

const currentModes = {
  switchImageChem: "",
  switchImageLight: ""
};

function changeImage(id, src, mode = "") {
  const img = document.getElementById(id);
  if (!img) return;

  if (mode) {
    clickedStates[id] = true;
    currentModes[id] = mode;
    localStorage.setItem(id + "_mode", mode); // 🔁 Save
  }
  img.src = src;
}

function resetImage(id) {
  const img = document.getElementById(id);
  if (!img) return;

  const savedMode = localStorage.getItem(id + "_mode");
  if (!clickedStates[id] && !savedMode) {
    img.src = defaultImages[id] || "images/SwitchAutoManual.PNG";
  } else {
    const mode = currentModes[id] || savedMode;
    if (mode === "auto") img.src = "images/AutoButton.PNG";
    else if (mode === "manual") img.src = "images/MaunualButton.PNG";
  }
}

// window.onload = () => {
//   ["switchImageLight", "switchImageChem"].forEach(id => resetImage(id));
// };
window.onload = () => {
  ["switchImageLight", "switchImageChem"].forEach(id => resetImage(id));
};


</script>
