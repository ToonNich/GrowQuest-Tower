<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('images/bridge.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Pixelify Sans', sans-serif;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.322);
            z-index: 0;
        }
        .name-image {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            z-index: 1;
        }
        .head-text {
            position: absolute;
            font-size: 30px;
            padding: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            z-index: 1;
        }
        .board-image {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            z-index: 1;
        }
        .login-button {
            width: 198px;
            height: 52px;
            background: url('images/loginButton1.png') no-repeat center center;
            background-size: cover;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 86%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .login-button:hover {
            background: url('images/loginButton2.png') no-repeat center center;
            background-size: cover;
        }
        .register-button {
            position: absolute; top: 91%; left: 88%; 
            font-size: 28px;
            text-decoration: underline; 
            background: none; border: none; 
            color: #000; font-family: 'Pixelify Sans', sans-serif;
            z-index: 2;
        }
        .input-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 45%; 
            height: 50px;
            z-index: 1;
        }
        .input-overlay {
            position: absolute;
            width: 87%;
            height: 50%;
            left: 5%;
            background-color: rgba(255, 255, 255, 0);
            border: none;
            padding: 8px;
            font-size: 24px;
            font-family: 'Pixelify Sans', sans-serif;
            z-index: 2;
            outline: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <img src="images/name1.PNG" class="name-image">
    <div>
        <p class="head-text" style="top: 42%; left: 25%;">Email:</p>
        <img src="images/board.PNG" class="board-image" style="top: 52%; left: 50%;">
        <div class="input-wrapper" style="top: 58%; left: 50%;">
            <input type="email" id="loginEmail" class="input-overlay" placeholder="Enter your email...">
        </div>
    </div>
    <div>
        <p class="head-text" style="top: 60%; left: 25%;">Password:</p>
        <img src="images/board.PNG" class="board-image" style="top: 70%; left: 50%;">
         <div class="input-wrapper" style="top: 76%; left: 50%;">
            <input type="password" id="loginPassword" class="input-overlay" placeholder="Enter your password...">
          <img src="images/hide.png" id="togglePassword" style="position: absolute; right: 50px; top: 45%; transform: translateY(-50%);width: 24px; height: 24px; cursor: pointer; z-index:2;">
         </div>
    </div>
    <div>
        <button class="register-button" onclick="location.href='RegisterPage.html'">Register</button>
    </div>
    <button class="login-button" id="loginButton"></button>

<script type="module">
  // --- UPDATED: Added Firestore imports ---
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
  import { getFirestore, doc, getDoc , setDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
  
  const firebaseConfig = {
    apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
    authDomain: "seniorproject-684c1.firebaseapp.com",
    projectId: "seniorproject-684c1",
    storageBucket: "seniorproject-684c1.appspot.com",
    messagingSenderId: "847138584376",
    appId: "1:847138584376:web:eface0926c96092daef3cd",
    measurementId: "G-N0CM5TQBM8"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app); // --- NEW: Initialize Firestore ---

  const loginButton = document.getElementById('loginButton');

        loginButton.addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
            .then(async (userCredential) => {
                const user = userCredential.user;
                console.log("Login successful for:", user.email);

                // 🔗 Auto-link RasPi to user
                const raspiID = "raspi_01";
                try {
                await setDoc(doc(db, "sensorLinks", raspiID), {
                    uid: user.uid
                });
                console.log(`✅ Linked ${raspiID} to UID: ${user.uid}`);
                } catch (e) {
                console.error("🔥 Failed to link RasPi ID:", e);
                }

                // ✅  /tubeData/[UID] exists
                try {
                await setDoc(doc(db, "tubeData", user.uid), { init: "yes" }, { merge: true });
                console.log("✅ tubeData root initialized for UID:", user.uid);
                } catch (e) {
                console.error("❌ Failed to create tubeData document:", e);
                }

                // 🌱 Redirect based on plant setup
                const plantDocRef = doc(db, "userPlants", user.uid);
                const docSnap = await getDoc(plantDocRef);

                if (docSnap.exists()) {
                window.location.href = "HomePage.html";
                } else {
                window.location.href = "CharacterPage.html"; 
                }
            })
            .catch((error) => {
                alert("Login failed: " + error.message);
            });

        });

    const passwordField = document.getElementById('loginPassword');
    const toggleIcon = document.getElementById('togglePassword');

    toggleIcon.addEventListener('click', () => {
        const isPasswordHidden = passwordField.type === "password";
        passwordField.type = isPasswordHidden ? "text" : "password";
        toggleIcon.src = isPasswordHidden ? "images/visible.png" : "images/hide.png";
    });

    

</script>
</body>
</html>
