<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning Chemical</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }
    .icon-light {
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      width: 180px;
      height: auto;
      top: 12.5%;
      left: 26%;
      z-index: 2;
    }
    .icon-label {
      position: absolute;
      width: 70px;
      height: auto;
      z-index: 2;
    }
    .SwitchAutoManual {
      position: absolute;
      top: 75%;
      left: 29%;
      width: 40px;
      height: auto;
      z-index: 1;
      transform: rotate(90deg);
    }
    .auto-button {
      position: absolute;
      top: 80.5%;
      left: 31.5%;
      width: 35px;
      height: 65px;
      z-index: 4;
      background: transparent;
      border: none;
      transform: rotate(90deg);
    }
    .manual-button {
      position: absolute;
      top: 80.2%;
      left: 27%;
      width: 35px;
      height: 70px;
      z-index: 4;
      background: transparent;
      border: none;
      transform: rotate(90deg);
    }
    .tube-outer {
      width: 45px;
      height: 315px;
      border: 6px solid white;
      background-color: transparent;
      overflow: hidden;
      position: absolute;
    }
    .tube-inner {
      width: 100%;
      background-color: #00ffff;
      position: absolute;
      bottom: 0;
      transition: height 0.5s ease-in-out;
    }
    /* BOARD AND BUTTONS */
    .board-container {
      position: absolute;
      top: 15%;
      right: 28%;
      width: 600px;
      z-index: 4;
    }
    .board-container .board-images {
      width: 110%;
      height: 600px;
      object-fit: fill;
      right: 50%;
    }
    .board-container .color-buttons {
      position: absolute;
      top: 11%;
      left: 55%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .color-buttons button {
      width: 100px;
      height: 40px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-family: 'Pixelify Sans', sans-serif;
    }
    .color-buttons .coolWhite {
      background-color: #00aaff;
    }
    .color-buttons .pinkTint {
      background-color: #ff69b4;
    }
    .color-buttons .red {
      background-color: red;
    }
    .tube-wrapper {
      position: absolute;
      width: 45px;
      height: 315px;
    }
    .tube-inner {
      position: absolute;
      left: 10%;
      width: 100%;
      height: 0%;
      bottom: -2%;
      background-color: #00ffff;
      z-index: 1;
      border-radius: 2px;
      transition: height 0.5s ease-in-out;
    }
    .tube-frame {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .color-title {
      position: absolute;
      top: 3%;
      left: 55%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Pixelify Sans', sans-serif;
      z-index: 5;
    }
    /* BlackBoard Tip for Light */
    .board-container .blackboard-tip {
      position: absolute;
      top: 25%;
      left: 10.5%;
      width: 86%;
      min-height: 70px;
      color: #fffbe0;
      font-family: 'Pixelify Sans', monospace;
      font-size: 19px;
      text-shadow: 1px 2px 2px #222, 0 0 10px #0a2e12;
      padding: 18px 18px 12px 18px;
      background: rgba(0,0,0,0.06);
      border-radius: 10px;
      box-sizing: border-box;
      z-index: 6;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='DashboardPage.html'"></button>
  <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
  <div>
    <img src="images/LightIcon.PNG" class="icon-light" alt="light" />
    <img src="images/label.PNG" class="icon-label" alt="label" style="top: 27%; left: 28%;" />
    <div class="tube-wrapper" style="top: 27.5%; left: 28.5%; position: absolute;">
      <div class="tube-inner" id="lightBar"></div>
    </div>
    <div id="lightValue" style="position: absolute;top: 65%;left: 28.8%;font-size: 20px;font-weight: bold;font-family: 'Pixelify Sans', sans-serif;color: #003366;z-index: 4;">--</div>
    <div class="switch-light-container">
      <img id="switchImageLight" src="images/SwitchAutoManual.PNG" alt="button-switch" class="SwitchAutoManual" />
      <button class="auto-button"
        onmouseover="changeImage('switchImageLight', 'images/AutoButton.PNG')"
        onmouseout="resetImage('switchImageLight')"
        onclick="changeImage('switchImageLight', 'images/AutoButton.PNG', 'auto')"
      ></button>
      <button class="manual-button"
        onmouseover="changeImage('switchImageLight', 'images/MaunualButton.PNG')"
        onmouseout="resetImage('switchImageLight')"
        onclick="changeImage('switchImageLight', 'images/MaunualButton.PNG', 'manual')"
      ></button>
    </div>
  </div>
  <!-- ✅ BOARD & COLOR BUTTONS INSIDE -->
  <div class="board-container">
    <img src="images/Blackboard.PNG" class="board-images" alt="board" />
    <p class="color-title">Color Preset</p>
    <div class="color-buttons">
      <button class="coolWhite" onclick="setLightColor('coolWhite')">Cool White</button>
      <button class="pinkTint" onclick="setLightColor('pinkTint')">Pink Tint</button>
      <button class="red" onclick="setLightColor('red')">Red</button>
    </div>
    <div class="blackboard-tip"></div>
  </div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
  authDomain: "seniorproject-684c1.firebaseapp.com",
  projectId: "seniorproject-684c1",
  storageBucket: "seniorproject-684c1.appspot.com",
  messagingSenderId: "847138584376",
  appId: "1:847138584376:web:eface0926c96092daef3cd",
  measurementId: "G-N0CM5TQBM8"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ----- Light tips -----
const tipsHigh = [
  "Sunburn warning! Leaves looking faded or crispy? Pull the tower back or dim the LEDs.",
  "Harsh light for long hours? Use a timer to shorten the photoperiod during hot hours.",
  "Bleaching leaves = too much light. Give your plants a few hours of shade."
];
const tipsLow = [
  "Plants want more light! Move closer to a bright window or add a grow light.",
  "Dust blocks photons. Wipe down reflectors and fixtures weekly.",
  "Rotate the tower so all sides get light evenly."
];

// Scale tube by lux (match Dashboard convention)
const MAX_LUX = 50000;

function updateTube(id, value, max) {
  const el = document.getElementById(id);
  if (!el) return;
  const percent = Math.min(100, Math.max(0, (Number(value) || 0) / max * 100));
  el.style.height = `${percent}%`;
}

function updateText(id, text) {
  const el = document.getElementById(id);
  if (el) el.innerText = text;
}

// Use the signed-in user's UID like Dashboard; fallback to "tube" if nobody is logged in.
onAuthStateChanged(auth, (user) => {
  const lightQuery = user
    ? query(collection(db, "tubeData", user.uid, "readings"), orderBy("timestamp", "desc"), limit(1))
    : query(collection(db, "tube"), orderBy("timestamp", "desc"), limit(1));

  onSnapshot(lightQuery, (snapshot) => {
    if (snapshot.empty) return;
    const data  = snapshot.docs[0].data();
    const light = (typeof data.light === 'number') ? data.light : 0; // lux

    updateTube('lightBar', light, MAX_LUX);
    const val = document.getElementById('lightValue');
    if (val) val.innerText = `${Math.round(light)} lux`;

    // Tips: decide based on % of MAX_LUX
    const pct = (light / MAX_LUX) * 100;
    const tipDiv = document.querySelector('.blackboard-tip');
    if (tipDiv) {
      tipDiv.textContent =
        pct >= 90 ? tipsHigh[Math.floor(Math.random() * tipsHigh.length)] :
        pct <= 30 ? tipsLow[Math.floor(Math.random() * tipsLow.length)] :
        "Light levels look good!";
    }
  });
});

// ------- existing UI handlers below (unchanged) -------
window.onload = () => { resetImage("switchImageLight"); };

window.changeImage = function (id, src, mode = "") {
  const img = document.getElementById(id);
  if (!img) return;
  if (mode) localStorage.setItem(id + "_mode", mode);
  img.src = src;
};

window.resetImage = function (id) {
  const img = document.getElementById(id);
  const mode = localStorage.getItem(id + "_mode");
  if (!mode) img.src = "images/SwitchAutoManual.PNG";
  else if (mode === "auto") img.src = "images/AutoButton.PNG";
  else if (mode === "manual") img.src = "images/MaunualButton.PNG";
};

window.setLightColor = function (color) {
  const brightness = 100;
  switch (color) {
    case 'coolWhite': return sendLightCommand({ colortemp: 6500, brightness });
    case 'pinkTint':  return sendLightCommand({ r: 255, g: 0, b: 180, brightness: 80 });
    case 'red':       return sendLightCommand({ r: 255, g: 0, b: 0, brightness });
    default:          return sendLightCommand({ colortemp: 6500, brightness });
  }
};

function sendLightCommand(body) {
  return fetch("http://localhost:8000/turn_on", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  })
    .then(res => res.json())
    .then(() => console.log("Light command sent:", body))
    .catch(err => console.error("Light command error:", err));
}
</script>


</body>
</html>
