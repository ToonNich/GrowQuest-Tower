<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning Chemical</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }
     /* ปุ่ม back ที่ใช้รูปภาพเป็นพื้นหลัง */
     .back-button {
      width: 60px; /* กำหนดขนาดของปุ่ม */
      height: 44px; /* กำหนดความสูงของปุ่ม */
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover; /* ให้รูปภาพปรับขนาดตามพื้นที่ของปุ่ม */
      border: none;
      cursor: pointer; /* เปลี่ยน cursor เป็นมือเมื่อ hover บนปุ่ม */
      position: absolute;
      top: 6%; /* อยู่กลางหน้าจอในแนวตั้ง */
      left: 4%;
      transform: translate(-50%, -50%); /* จัดตำแหน่งให้ตรงกลาง */
      z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    /* เปลี่ยนแปลงเมื่อ hover ที่ปุ่ม */
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center; /* เปลี่ยนเป็นรูปที่เตรียมไว้ */
      background-size: cover; /* ให้รูปภาพที่ใหม่ปรับขนาด */
    }

    /* กล่องรูปภาพกลางที่อยู่ระหว่าง bg และ sprite */
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%; /* ปรับขนาดตามต้องการ */
      z-index: 1; /* ให้รูปกลางอยู่ด้านล่าง */
    }
    .head-text {
      position: absolute;
      font-size: 30px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    .icon-light {
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      width: 180px; /* ปรับขนาดไอคอน */
      height: auto;
      top: 12.5%; 
      left: 25%; 
      z-index: 2;
    } 
    .icon-label {
      position: absolute;
      width: 70px; /* ปรับขนาดไอคอน */
      height: auto;
      z-index: 2; 
    }
    .SwitchAutoManual { 
    position: absolute;
    top: 75%;
    left: 29%;
    width: 40px;
    height: auto;
    z-index: 1;
    transform: rotate(90deg);
    } 

  .auto-button {
    position: absolute;
    top: 80.5%;
    left: 31.5%;
    width: 35px;
    height: 65px;
    z-index: 4;
    background: transparent;
    border: none;
    transform: rotate(90deg);
    }

  .manual-button {
    position: absolute;
    top: 80.2%;
    left: 27%;
    width: 35px;
    height: 70px;
    z-index: 4;
    background: transparent;
    border: none;
    transform: rotate(90deg);
   }
   .board-images {
    position: absolute;
    top: 12%;
    right: 22%;
    width: 600px;
    height: auto;
    z-index: 4;
   }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='WarningPage.html'"></button>
  <div>
    <!-- 🔽 รูปกลางที่อยู่ระหว่าง bg และ sprite -->
    <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
    <div>
        <img src="images/LightIcon.PNG" class="icon-light" alt="light" />
        <img src="images/label.PNG" class="icon-label" alt="label" style="top: 27%; left: 28%;" />
        <!-- 🔁 ปุ่มควบคุมไฟใหม่ -->
        <div class="switch-light-container">
          <img id="switchImageLight" src="images/SwitchAutoManual.PNG" alt="button-switch" class="SwitchAutoManual" style="top: 75%; left: 29%; transform: rotate(90deg);" />

          <button class="auto-button"
            style="top: 80.5%; left: 31.5%; transform: rotate(90deg);"
            onmouseover="changeImage('switchImageLight', 'images/AutoButton.PNG')"
            onmouseout="resetImage('switchImageLight')"
            onclick="changeImage('switchImageLight', 'images/AutoButton.PNG', 'auto')"
          ></button>

          <button class="manual-button"
            style="top: 80.2%; left: 27%; transform: rotate(90deg);"
            onmouseover="changeImage('switchImageLight', 'images/MaunualButton.PNG')"
            onmouseout="resetImage('switchImageLight')"
            onclick="changeImage('switchImageLight', 'images/MaunualButton.PNG', 'manual')"
          ></button>
        </div>
    </div>
    <div>
      <img src="images/Blackboard.PNG" class="board-images" alt="board" />
    </div>
  </div>
</body>
<script>
const defaultImages = {
  switchImage: "images/SwitchAutoManual.PNG"
};

const clickedStates = {
  switchImage: false
};

const currentModes = {
  switchImage: ""
};

function changeImage(id, src, mode = "") {
  const img = document.getElementById(id);
  if (!img) return;
  if (mode) {
    localStorage.setItem(id + "_mode", mode); // 🔁 Save
  }
  img.src = src;
}

function resetImage(id) {
  const img = document.getElementById(id);
  const mode = localStorage.getItem(id + "_mode");
  if (!mode) {
    img.src = "images/SwitchAutoManual.PNG";
  } else if (mode === "auto") {
    img.src = "images/AutoButton.PNG";
  } else if (mode === "manual") {
    img.src = "images/MaunualButton.PNG";
  }
}

window.onload = () => {
  resetImage("switchImageLight"); // 🔁 Load
};
</script>
</html>
