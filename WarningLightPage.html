  <script>
  function changeImage(id, src, mode = "") {
    const img = document.getElementById(id);
    if (!img) return;
    if (mode) {
      localStorage.setItem(id + "_mode", mode); // 🔁 Save
    }
    img.src = src;
  }

  function resetImage(id) {
    const img = document.getElementById(id);
    const mode = localStorage.getItem(id + "_mode");
    if (!mode) {
      img.src = "images/SwitchAutoManual.PNG";
    } else if (mode === "auto") {
      img.src = "images/AutoButton.PNG";
    } else if (mode === "manual") {
      img.src = "images/MaunualButton.PNG";
    }
  }

</script>

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadLight() {
    const snapshot = await getDocs(collection(db, "alerts"));
    const docs = snapshot.docs.map(doc => doc.data());
    if (docs.length === 0) return;
    const latest = docs[docs.length - 1];
    const values = latest.values;

    // อัปเดตหลอด
    updateTube('lightBar', values.light, 100);
    console.log("Light from Firestore:", values.light);
  }

  function updateTube(id, value, max) {
    const percent = Math.min(100, (value / max) * 100);
    const el = document.getElementById(id);
    if (el) el.style.height = `${percent}%`;
  }
