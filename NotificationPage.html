    body::before {

     /* ปุ่ม back ที่ใช้รูปภาพเป็นพื้นหลัง */

      border: none;
      cursor: pointer; /* เปลี่ยน cursor เป็นมือเมื่อ hover บนปุ่ม */
      position: absolute;
      top: 6%; /* อยู่กลางหน้าจอในแนวตั้ง */
      left: 4%;
      transform: translate(-50%, -50%); /* จัดตำแหน่งให้ตรงกลาง */
      z-index: 2; /* ให้ปุ่มอยู่บนรูปภาพ */
    }
    /* เปลี่ยนแปลงเมื่อ hover ที่ปุ่ม */
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center; /* เปลี่ยนเป็นรูปที่เตรียมไว้ */
      background-size: cover; /* ให้รูปภาพที่ใหม่ปรับขนาด */
    }
    .middle-image {
      position: absolute;

      z-index: 1; /* ให้รูปกลางอยู่ด้านล่าง */
    }
    .head-text {

  <script>
    function toggleStar(button) {
      if (button.classList.contains('star3-button')) {
        button.classList.remove('star3-button');
        button.classList.add('star1-button');
      } else {
        button.classList.remove('star1-button');
        button.classList.add('star3-button');
      }
    }

    function toggleStar(button) {
    if (button.classList.contains('star3-button')) {
      button.classList.remove('star3-button');
      button.classList.add('star1-button');
    } else {
      button.classList.remove('star1-button');
      button.classList.add('star3-button');
    }
  }

    function markAsRead(button) {
      button.classList.remove('unread');
      button.classList.add('read');
    }

    function toggleStar(button) {
    if (button.classList.contains('star3-button')) {
      button.classList.remove('star3-button');
      button.classList.add('star1-button');
    } else {
      button.classList.remove('star1-button');
      button.classList.add('star3-button');
    }
  }

  function openNotification(button, link) {
    // เปลี่ยน icon เป็นอ่านแล้ว
    button.classList.remove('unread');
    button.classList.add('read');

    // ไปยังหน้าเนื้อหาการแจ้งเตือน
    setTimeout(() => {
      window.location.href = link;
    }, 200); // เลื่อนนิดนึงให้เห็น effect ก่อนเปลี่ยนหน้า
  }
  </script>
