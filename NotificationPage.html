<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.322);
      z-index: 0;
    }
    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }
    .notification-list {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      z-index: 2;
      margin-bottom: 140px;
    }
    .notification-item {
      background-color: rgba(255, 255, 255, 0.2);
      margin-bottom: 12px;
      padding: 10px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .notification-item:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }
    .notification-left {
      display: flex;
      align-items: center;
    }
    .notification-icon {
      width: 60px;
      height: 60px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .notification-title {
      font-size: 20px;
      margin-left: 20px;
      color: #000;
    }
    .notification-actions {
      display: flex;
      align-items: center;
    }
    .bin-button {
      width: 36px;
      height: 36px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none;
      cursor: pointer;
      margin-left: 10px;
      background-color: transparent;
    }
    .bin-button {
      background-image: url('images/bin1.PNG');
    }
    .star-button {
      width: 36px;
      height: 36px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: none;
      cursor: pointer;
      margin-left: 10px;
      background-color: transparent;
    }

    .starred {
      background-image: url('images/star1.PNG');
    }

    .starred:hover {
      background-image: url('images/star2.PNG');
    }

    .unstarred {
      background-image: url('images/star3.PNG');
    }

    /* .star-button {
      background-image: url('images/star3.PNG');
    } */
    
    .divider {
      width: 100%;
      height: 0.5px;
      background-color: #000000;
      opacity: 0.4;
      margin: 8px 0;
    }
    .pagination {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }
    .pagination button {
      padding: 10px 16px;
      font-size: 18px;
      font-family: 'Pixelify Sans', sans-serif;
      background-color: #ffd700;
      border: 4px solid #000;
      box-shadow: 4px 4px 0px #333;
      border-radius: 8px;
      cursor: pointer;
      color: #000;
      transition: all 0.1s;
    }
    .pagination button:hover {
      background-color: #ffa500;
      transform: translateY(2px);
      box-shadow: 2px 2px 0px #333;
    }
    .pagination button.active {
      background-color: #ff8c00;
      transform: none;
      box-shadow: none;
    }
    .pagination button.disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
    }
    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='HomePage.html'"></button>
  <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
  <div class="notification-list" id="notificationList"></div>
  <div class="pagination" id="pagination"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
    import { getFirestore, collection, getDocs, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let notifications = [];
    const perPage = 6;
    let currentPage = 1;

    async function fetchNotifications() {
      const snapshot = await getDocs(collection(db, "Main"));
      notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderNotifications();
      renderPagination();
    }

    function renderNotifications() {
      const list = document.getElementById('notificationList');
      list.innerHTML = '';
      const start = (currentPage - 1) * perPage;
      const pageItems = notifications.slice(start, start + perPage);

      pageItems.forEach((noti, index) => {
        const isStarred = noti.starred;
        const starClass = isStarred ? 'starred' : 'unstarred';

        const div = document.createElement('div');
        div.className = 'notification-item';
        div.addEventListener('click', async () => {
          // const docRef = doc(db, "notifications", noti.id);
          const docRef = doc(db, "Main", noti.id);
          await updateDoc(docRef, { read: true });
          noti.read = true;
          renderNotifications();
          renderPagination();
          setTimeout(() => {
            window.location.href = `NotificationDetail.html?id=${noti.id}`;

          }, 150);
        });

        div.innerHTML = `
          <div class="notification-left">
            <div class="notification-icon" style="background-image: url('images/${noti.read ? 'bell2.PNG' : 'bell1.PNG'}')"></div>
            <div class="notification-title">${noti.title}</div>
          </div>
          <div class="notification-actions">
            <button class="star-button ${starClass}" onclick="toggleStar(event, '${noti.id}', ${isStarred})"></button>
            <button class="bin-button"></button>
          </div>
        `;

        const starBtn = div.querySelector('.star-button');
        const binBtn = div.querySelector('.bin-button');

        starBtn.addEventListener('click', (e) => {
          e.stopPropagation();
        });

        binBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const confirmed = confirm("คุณแน่ใจหรือไม่ว่าต้องการลบการแจ้งเตือนนี้?");
          if (!confirmed) return;
          // await deleteDoc(doc(db, "notifications", noti.id));
          await deleteDoc(doc(db, "Main", noti.id));
          await fetchNotifications();
        });

        list.appendChild(div);

        if (index < pageItems.length - 1) {
          const divider = document.createElement('div');
          divider.className = 'divider';
          list.appendChild(divider);
        }
      });
    }

    window.toggleStar = async function(event, docId, currentState) {
      event.stopPropagation();
      const newState = !currentState;
      // const docRef = doc(db, "notifications", docId);
      // await updateDoc(docRef, { starred: newState });
      const docRef = doc(db, "Main", docId);
      await updateDoc(docRef, { starred: newState });

      await fetchNotifications(); // โหลดใหม่เพื่ออัปเดต UI
    }


    function renderPagination() {
      const container = document.getElementById('pagination');
      container.innerHTML = '';
      const totalPages = Math.ceil(notifications.length / perPage);

      const prevBtn = document.createElement('button');
      prevBtn.textContent = 'Prev';
      prevBtn.disabled = currentPage === 1;
      if (prevBtn.disabled) prevBtn.classList.add('disabled');
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderNotifications();
          renderPagination();
        }
      };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => {
          currentPage = i;
          renderNotifications();
          renderPagination();
        };
        container.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Next';
      nextBtn.disabled = currentPage === totalPages;
      if (nextBtn.disabled) nextBtn.classList.add('disabled');
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderNotifications();
          renderPagination();
        }
      };
      container.appendChild(nextBtn);
    }

    fetchNotifications();
  </script>
</body>
</html>
