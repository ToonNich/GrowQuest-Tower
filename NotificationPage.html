<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet" />
  <title>Notification</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6oeXokIhQuOj8RJ2mpXPqwqP10gD0Xd0",
      authDomain: "seniorproject-684c1.firebaseapp.com",
      projectId: "seniorproject-684c1",
      storageBucket: "seniorproject-684c1.appspot.com",
      messagingSenderId: "847138584376",
      appId: "1:847138584376:web:eface0926c96092daef3cd",
      measurementId: "G-N0CM5TQBM8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadNotifications() {
      const container = document.getElementById('notifications');
      let topOffset = 12;

      console.log("⏳ เริ่มโหลด notifications...");
      try {
        const querySnapshot = await getDocs(collection(db, "notifications"));
        console.log("📦 จำนวนที่ได้:", querySnapshot.size);

        if (querySnapshot.empty) {
          console.log("⚠️ ไม่พบข้อมูลใด ๆ ใน collection 'notifications'");
        }

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          console.log("✅ Loaded document:", id, data);

          const readClass = data.read ? 'read' : 'unread';
          const block = document.createElement('div');
          block.innerHTML = `
            <div class="alert-title" style="top: ${topOffset}%; left: 30%;">${data.title}</div>
            <button class="${readClass}" style="top: ${topOffset + 5}%; left: 26%; transform: translate(-50%, -50%);"
              onclick="openNotification(this, '${data.detailLink || 'NotificationDetail.html'}', '${id}')"></button>
            <button class="bin-button" style="top: ${topOffset + 10}%; right: 24%; transform: translate(-50%, -50%);"></button>
            <button class="star3-button" style="top: ${topOffset + 10}%; right: 28%; transform: translate(-50%, -50%);"
              onclick="toggleStar(this)"></button>
            <div class="divider" style="top: ${topOffset + 13}%; position: absolute; left: 50%;"></div>
          `;
          container.appendChild(block);
          topOffset += 20;
        });
      } catch (err) {
        console.error("❌ เกิดข้อผิดพลาดในการโหลด notifications:", err);
      }
    }

    window.openNotification = async function(button, link, docId) {
      button.classList.remove('unread');
      button.classList.add('read');
      const docRef = doc(db, "notifications", docId);
      await updateDoc(docRef, { read: true });
      setTimeout(() => {
        window.location.href = link;
      }, 200);
    }

    window.toggleStar = function(button) {
      if (button.classList.contains('star3-button')) {
        button.classList.remove('star3-button');
        button.classList.add('star1-button');
      } else {
        button.classList.remove('star1-button');
        button.classList.add('star3-button');
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      console.log("📄 DOM โหลดเสร็จแล้ว กำลังโหลดการแจ้งเตือน...");
      await loadNotifications();
    });
  </script>

  <style>
    body {
      background: url('images/info.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pixelify Sans', sans-serif;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.322);
      z-index: 0;
    }

    .back-button {
      width: 60px;
      height: 44px;
      background: url('images/backButton1.png') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 6%;
      left: 4%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .back-button:hover {
      background: url('images/backButton2.png') no-repeat center center;
      background-size: cover;
    }

    .middle-image {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      z-index: 1;
    }

    .alert-title {
      position: absolute;
      font-size: 24px;
      color: #000000;
      font-weight: bold;
      z-index: 2;
      white-space: nowrap;
    }

    .unread, .read {
      width: 70px;
      height: 80px;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      z-index: 2;
      background-color: transparent;

    }

    .unread {
      background-image: url('images/bell1.PNG');
    }

    .read {
      background-image: url('images/bell2.PNG');
    }

    .bin-button {
      width: 40px;
      height: 40px;
      background: url('images/bin1.PNG') no-repeat center center;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      z-index: 2;
    }

    .bin-button:hover {
      background: url('images/bin2.PNG') no-repeat center center;
      background-size: cover;
    }

    .star3-button, .star1-button {
      width: 50px;
      height: 40px;
      background-size: cover;
      border: none;
      cursor: pointer;
      position: absolute;
      z-index: 2;
        background-color: transparent;
    }

    .star3-button {
      background-image: url('images/star3.PNG');
    }

    .star1-button {
      background-image: url('images/star1.PNG');
    }

    .divider {
      width: 52%;
      height: 0.5px;
      background-color: #000000;
      opacity: 0.6;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
  </style>
</head>

<body>
  <button class="back-button" onclick="location.href='HomePage.html'"></button>
  <img src="images/Scroll 3.png" alt="Middle Layer" class="middle-image">
  <div id="notifications"></div>
</body>
</html>
